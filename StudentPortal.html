<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --red: #d71920;
      --dark-red: #9d1116;
      --black: #0b0b0b;
      --soft-black: #171717;
      --white: #ffffff;
      --gray: #b8b8b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(215, 25, 32, .22), transparent 35%),
        linear-gradient(180deg, #161616 0%, #050505 100%);
      color: var(--white);
      min-height: 100vh;
    }

    .top-banner {
      background:
        linear-gradient(135deg, rgba(215, 25, 32, .95), rgba(120, 0, 0, .95));
      padding: 26px 20px 34px;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid #000;
    }

    .top-banner::before,
    .top-banner::after {
      content: "🐾";
      position: absolute;
      font-size: 70px;
      opacity: .12;
      transform: rotate(-15deg);
    }

    .top-banner::before {
      left: 20px;
      top: 5px;
    }

    .top-banner::after {
      right: 20px;
      bottom: 0;
      transform: rotate(20deg);
    }

    .lion {
      font-size: 70px;
      line-height: 1;
      margin-bottom: 6px;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,.35));
    }

    .top-banner h1 {
      margin: 0;
      font-size: clamp(34px, 9vw, 54px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .top-banner h2 {
      margin: 4px 0 0;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 800;
      color: #ffe8e8;
    }

    .tagline {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: .95;
    }

    .container {
      width: min(440px, 92%);
      margin: -18px auto 0;
      position: relative;
      z-index: 5;
      padding-bottom: 40px;
    }

    .card {
      background:
        linear-gradient(180deg, rgba(28,28,28,.98), rgba(8,8,8,.98));
      border: 2px solid var(--red);
      border-radius: 22px;
      padding: 26px 22px;
      box-shadow:
        0 20px 45px rgba(0,0,0,.45),
        0 0 20px rgba(215,25,32,.18);
    }

    .welcome {
      text-align: center;
      margin-bottom: 22px;
    }

    .welcome .paw {
      font-size: 30px;
      margin-bottom: 4px;
    }

    .welcome h3 {
      margin: 0;
      font-size: 28px;
      color: var(--white);
      text-transform: uppercase;
      font-weight: 900;
    }

    .welcome p {
      margin: 7px 0 0;
      color: var(--gray);
      font-size: 14px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: #ff4c52;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 14px;
      letter-spacing: .6px;
    }

    input {
      width: 100%;
      min-height: 52px;
      border: 2px solid #4a4a4a;
      border-radius: 13px;
      padding: 12px 14px;
      font-size: 17px;
      background: #0e0e0e;
      color: white;
      outline: none;
      transition: .2s;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(215,25,32,.16);
    }

    input::placeholder {
      color: #777;
    }

    .sign-in {
      width: 100%;
      margin-top: 22px;
      min-height: 56px;
      border: none;
      border-radius: 14px;
      background:
        linear-gradient(135deg, var(--red), var(--dark-red));
      color: white;
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(215,25,32,.28);
    }

    .sign-in:active {
      transform: scale(.98);
    }

    .message {
      min-height: 24px;
      margin-top: 14px;
      text-align: center;
      font-size: 14px;
      color: #ffd7d7;
    }

    .family {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .family span {
      color: var(--red);
    }

    .safety-banner {
      margin-top: 18px;
      background:
        linear-gradient(135deg, #111, #000);
      border: 1px solid #333;
      border-left: 5px solid var(--red);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .safety-banner::after {
      content: "🔑";
      position: absolute;
      right: 12px;
      bottom: 0;
      font-size: 55px;
      opacity: .12;
      transform: rotate(-20deg);
    }

    .safety-banner .small {
      display: block;
      color: #aaa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }

    .safety-banner strong {
      display: block;
      font-size: 23px;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .safety-banner strong span {
      color: var(--red);
    }

    .footer-paws {
      text-align: center;
      margin-top: 16px;
      font-size: 20px;
      letter-spacing: 8px;
      opacity: .55;
    }

    @media (max-width: 480px) {
      .top-banner {
        padding-top: 22px;
      }

      .lion {
        font-size: 62px;
      }

      .card {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<script>
  let loggedInStudent = null;
function openScheduleRequest() {

  if (!loggedInStudent || !loggedInStudent.id) {
    alert('Please sign in first.');
    return;
  }

  const panel =
    document.getElementById('scheduleRequestPanel');

  if (panel.style.display === 'block') {
    panel.style.display = 'none';
    return;
  }

  panel.innerHTML =
    '<div style="' +
      'padding:16px;' +
      'border:1px solid #333;' +
      'border-radius:12px;' +
      'background:#111;' +
      'color:#fff;' +
      'text-align:left;' +
    '">' +

      '<div style="font-size:18px; font-weight:900; margin-bottom:6px;">' +
        '🔄 Schedule Change Request' +
      '</div>' +

      '<div style="color:#aaa; font-size:13px; margin-bottom:14px;">' +
        'Submit a request for coordinator approval.' +
      '</div>' +

      '<label for="studentScheduleRequestDate">Date *</label>' +
      '<input ' +
        'id="studentScheduleRequestDate" ' +
        'type="date" ' +
        'onchange="loadStudentScheduleRequestShifts()"' +
      '>' +

      '<label for="studentScheduleRequestShift">' +
        'Regular Shift to Change *' +
      '</label>' +

      '<select ' +
        'id="studentScheduleRequestShift" ' +
        'style="' +
          'width:100%;' +
          'min-height:48px;' +
          'border:2px solid #4a4a4a;' +
          'border-radius:13px;' +
          'padding:12px 14px;' +
          'font-size:16px;' +
          'background:#0e0e0e;' +
          'color:white;' +
        '"' +
      '>' +
        '<option value="">Select a date first</option>' +
      '</select>' +

      '<label for="studentScheduleRequestedStart">' +
        'Requested Start Time *' +
      '</label>' +

      '<input ' +
        'id="studentScheduleRequestedStart" ' +
        'type="time"' +
      '>' +

      '<label for="studentScheduleRequestedEnd">' +
        'Requested End Time *' +
      '</label>' +

      '<input ' +
        'id="studentScheduleRequestedEnd" ' +
        'type="time"' +
      '>' +

      '<label for="studentScheduleRequestReason">Reason *</label>' +

      '<select ' +
        'id="studentScheduleRequestReason" ' +
        'style="' +
          'width:100%;' +
          'min-height:48px;' +
          'border:2px solid #4a4a4a;' +
          'border-radius:13px;' +
          'padding:12px 14px;' +
          'font-size:16px;' +
          'background:#0e0e0e;' +
          'color:white;' +
        '"' +
      '>' +
        '<option value="">Select a reason</option>' +
        '<option value="Class Conflict">Class Conflict</option>' +
        '<option value="Doctor Appointment">Doctor Appointment</option>' +
        '<option value="Family Emergency">Family Emergency</option>' +
        '<option value="Academic Responsibility">Academic Responsibility</option>' +
        '<option value="Transportation Issue">Transportation Issue</option>' +
        '<option value="Personal Emergency">Personal Emergency</option>' +
        '<option value="Other">Other</option>' +
      '</select>' +

      '<label for="studentScheduleRequestComments">Comments</label>' +

      '<textarea ' +
        'id="studentScheduleRequestComments" ' +
        'placeholder="Explain the requested change." ' +
        'style="' +
          'width:100%;' +
          'min-height:100px;' +
          'border:2px solid #4a4a4a;' +
          'border-radius:13px;' +
          'padding:12px 14px;' +
          'font-size:16px;' +
          'background:#0e0e0e;' +
          'color:white;' +
          'resize:vertical;' +
        '"' +
      '></textarea>' +

      '<button ' +
        'id="studentScheduleRequestSubmit" ' +
        'class="sign-in" ' +
        'type="button" ' +
        'onclick="submitStudentScheduleRequest()"' +
      '>' +
        'SUBMIT REQUEST' +
      '</button>' +

      '<div ' +
        'id="studentScheduleRequestMessage" ' +
        'style="margin-top:12px; font-size:14px;"' +
      '></div>' +

    '</div>';

  panel.style.display = 'block';
}

  function studentLogin() {
    const studentId = document.getElementById('studentId').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const message = document.getElementById('message');

    message.textContent = '';

    if (!studentId || !pin) {
      message.textContent = 'Please enter your Student ID and PIN.';
      return;
    }

    google.script.run
      .withSuccessHandler(function(student) {
        loggedInStudent = student;
  message.textContent = 'Welcome, ' + student.name + '! 🦁';

  document.getElementById('dashboardStudentName').textContent =
    'Welcome, ' + student.name + '!';

  document.getElementById('studentDashboard').style.display = 'block';

  loadWeeklyFeedback();
  loadCurrentFiestaProgress();
  loadActivityRanking();
})
      .withFailureHandler(function(error) {
        message.textContent = error.message || 'Unable to sign in.';
      })
      .verifyStudentNumberPin(studentId, pin);
  }
function loadStudentScheduleRequestShifts() {

  if (!loggedInStudent || !loggedInStudent.id) {
    alert('Please sign in first.');
    return;
  }

  const scheduleDate =
    document.getElementById(
      'studentScheduleRequestDate'
    ).value;

  const shiftSelect =
    document.getElementById(
      'studentScheduleRequestShift'
    );

  if (!scheduleDate) {
    shiftSelect.innerHTML =
      '<option value="">Select a date first</option>';
    return;
  }

  shiftSelect.innerHTML =
    '<option value="">Loading scheduled shifts…</option>';

  google.script.run
    .withSuccessHandler(function(shifts) {

      shiftSelect.innerHTML =
        '<option value="">Select a scheduled shift</option>';

      shifts.forEach(function(shift) {

        const option =
          document.createElement('option');

        option.value =
          shift.scheduleId;

        option.textContent =
          shift.label;

        option.dataset.start =
          shift.start;

        option.dataset.end =
          shift.end;

        shiftSelect.appendChild(option);
      });

      if (!shifts.length) {
        shiftSelect.innerHTML =
          '<option value="">No regular shifts found for this date</option>';
      }

    })
    .withFailureHandler(function(error) {

      shiftSelect.innerHTML =
        '<option value="">Unable to load scheduled shifts</option>';

      alert(
        '⚠️ ' +
        (error.message || String(error))
      );

    })
    .getScheduleShiftsForRequest(
      loggedInStudent.id,
      scheduleDate
    );
}
function loadMySchedule() {

    const existingPanel = document.getElementById('schedulePanel');

  if (existingPanel.style.display === 'block') {
    existingPanel.style.display = 'none';
    return;
  }
  
  if (!loggedInStudent || !loggedInStudent.id) {
    alert('Please sign in first.');
    return;
  }

  google.script.run
   .withSuccessHandler(function(data) {
  let scheduleText = '';

  if (data.regularSchedules.length) {
    data.regularSchedules.forEach(function(shift) {
      scheduleText +=
        shift.day +
        ': ' +
        shift.start +
        ' - ' +
        shift.end +
        '\n';
    });
  } else {
    scheduleText = 'No regular schedule found.';
  }

if (data.approvedChanges && data.approvedChanges.length) {
  scheduleText += '\n📌 APPROVED SCHEDULE CHANGES\n';

  data.approvedChanges.forEach(function(change) {
    scheduleText +=
      (change.replacementDate || change.originalDate) +
      ': ' +
      (change.replacementStart || change.originalStart) +
      ' - ' +
      (change.replacementEnd || change.originalEnd) +
      '\n';
  });
}

if (data.activities && data.activities.length) {
  scheduleText += '\n🎉 ASSIGNED ACTIVITIES\n';

  data.activities.forEach(function(activity) {
    scheduleText +=
      activity.date +
      ': ' +
      activity.activityName +
      ' — ' +
      activity.start +
      ' - ' +
      activity.end +
      '\n';
  });
}

  const panel = document.getElementById('schedulePanel');

panel.innerHTML =
  '<div style="padding:16px; border:1px solid #333; border-radius:12px; background:#111; text-align:left;">' +
    '<div style="font-weight:800; color:#fff; margin-bottom:12px;">📅 MY REGULAR SCHEDULE</div>' +
    '<div style="color:#fff; white-space:pre-line; line-height:1.8;">' +
      scheduleText +
    '</div>' +
  '</div>';

panel.style.display = 'block';
})
    .withFailureHandler(function(error) {
  const panel = document.getElementById('schedulePanel');

  panel.innerHTML =
    '<div style="padding:16px; border:1px solid #d71920; border-radius:12px; background:#111; color:#fff;">' +
      '⚠️ ' + String(error) +
    '</div>';

  panel.style.display = 'block';
  
})

    .getStudentScheduleViewerData(loggedInStudent.id);
}

function loadAchievements() {

  if (!loggedInStudent || !loggedInStudent.id) {
    return;
  }

  const panel =
    document.getElementById(
      'achievementsPanel'
    );

  panel.style.display = 'block';

  panel.innerHTML =
    '<div style="padding:14px; background:#181818; border:1px solid #3a3a3a; border-radius:12px;">Loading achievements...</div>';

  google.script.run
    .withSuccessHandler(function(result) {

      const achievements =
        result &&
        Array.isArray(result.achievements)
          ? result.achievements
          : [];

      if (!achievements.length) {
        panel.innerHTML =
          '<div style="padding:14px; background:#181818; border:1px solid #3a3a3a; border-radius:12px; text-align:center;">' +
          '<div style="font-size:34px; margin-bottom:8px;">🛡️</div>' +
          '<div style="font-weight:800;">Your achievement journey starts here!</div>' +
          '<div style="margin-top:6px; color:#aaa; font-size:13px;">Keep showing up, being on time, and giving your best.</div>' +
          '</div>';

        return;
      }

      let html =
        '<div style="padding:16px; background:#181818; border:1px solid #3a3a3a; border-radius:12px;">' +
        '<div style="font-size:18px; font-weight:900; margin-bottom:14px;">🏆 My Achievements</div>';

      achievements.forEach(function(item) {

        html +=
          '<div style="padding:12px; margin-bottom:10px; background:#222; border:1px solid #444; border-radius:10px;">' +
          '<div style="font-weight:900;">' +
          escapeHtml(item.name || 'Achievement') +
          '</div>' +
          '<div style="margin-top:5px; font-size:13px; color:#ccc;">' +
          escapeHtml(item.description || '') +
          '</div>' +
          '<div style="margin-top:6px; font-size:12px; color:#888;">' +
          escapeHtml(item.date || '') +
          '</div>' +
          '</div>';
      });

      html += '</div>';

      panel.innerHTML = html;

    })
    .withFailureHandler(function(error) {

      panel.innerHTML =
        '<div style="padding:14px; background:#381818; border:1px solid #7a3030; border-radius:12px;">' +
        escapeHtml(
          error.message ||
          'Unable to load achievements.'
        ) +
        '</div>';

    })
    .getStudentAchievements(
      loggedInStudent.id
    );
}

function loadWeeklyFeedback() {

  if (!loggedInStudent || !loggedInStudent.id) {
    return;
  }

  google.script.run
    .withSuccessHandler(function(result) {

      const card =
        document.getElementById(
          'weeklyFeedbackCard'
        );

      const level =
        document.getElementById(
          'weeklyFeedbackLevel'
        );

      const message =
        document.getElementById(
          'weeklyFeedbackMessage'
        );

      const dates =
        document.getElementById(
          'weeklyFeedbackDates'
        );

      if (
        !result ||
        !result.hasFeedback
      ) {
        card.style.display = 'none';
        return;
      }

      level.textContent =
        result.level || 'Weekly Feedback';

      message.textContent =
        result.message || '';

      dates.textContent =
        result.weekStart &&
        result.weekEnd
          ? result.weekStart +
            ' - ' +
            result.weekEnd
          : '';

      card.style.display = 'block';

    })
    .withFailureHandler(function(error) {

      console.error(

function loadActivityRanking() {

  if (!loggedInStudent) {
    return;
  }

  const card =
    document.getElementById(
      'activityRankingCard'
    );

  const period =
    document.getElementById(
      'activityRankingPeriod'
    );

  const myProgress =
    document.getElementById(
      'activityRankingMyProgress'
    );

  const list =
    document.getElementById(
      'activityRankingList'
    );

  google.script.run
    .withSuccessHandler(function(data) {

      const ranking =
        data.ranking || [];

      period.textContent =
        data.periodLabel || '';

      const me =
        ranking.find(function(item) {
          return (
            String(item.studentId) ===
            String(loggedInStudent.id)
          );
        });

      if (me) {

        myProgress.innerHTML =
          '<strong>Your Progress</strong><br>' +
          '🏅 Rank: #' +
          me.rank +
          '<br>' +
          '🎉 Completed Activities: ' +
          me.activityCount +
          '<br>' +
          escapeHtml(me.label);

      } else {

        myProgress.innerHTML =
          '<strong>Your Progress</strong><br>' +
          '🌱 Complete your first activity to enter the ranking.';
      }

      if (!ranking.length) {

        list.innerHTML =
          '<div style="color:#aaa;">' +
          'No completed activities yet this period.' +
          '</div>';

        card.style.display =
          'block';

        return;
      }

      let html = '';

      ranking.forEach(function(item) {

        let medal = '🏅';

        if (item.rank === 1) {
          medal = '🥇';
        } else if (item.rank === 2) {
          medal = '🥈';
        } else if (item.rank === 3) {
          medal = '🥉';
        }

        html +=
          '<div style="' +
            'padding:10px 0;' +
            'border-bottom:1px solid #333;' +
          '">' +
            medal +
            ' #' +
            item.rank +
            ' ' +
            escapeHtml(
              item.studentName
            ) +
            ' — ' +
            item.activityCount +
            ' activities' +
            '<br>' +
            '<span style="color:#aaa;">' +
              escapeHtml(
                item.label
              ) +
            '</span>' +
          '</div>';
      });

      list.innerHTML =
        html;

      card.style.display =
        'block';
    })
    .withFailureHandler(function(error) {

      console.error(
        'Activity ranking error:',
        error
      );

      card.style.display =
        'none';
    })
    .getStudentActivityRanking();
}

const cardBorder = activity.past ? '#555' : '#3a3a3a';

function requestActivityParticipation(activityId) {
  if (!loggedInStudent || !loggedInStudent.id) {
    alert('Please sign in first.');
    return;
  }
  const hoursTreatment = prompt(
    'How will you participate?\n\n' +
    '1 - Additional Hours\n' +
    '2 - Volunteer Hours\n' +
    '3 - Replace Regular Schedule\n\n' +
    'Enter 1, 2, or 3:'
  );

  let selectedTreatment = '';

  if (hoursTreatment === '1') {
    selectedTreatment = 'ADDITIONAL HOURS';
  } else if (hoursTreatment === '2') {
    selectedTreatment = 'VOLUNTEER HOURS';
  } else if (hoursTreatment === '3') {
    selectedTreatment = 'REPLACES REGULAR SHIFT';
  } else {
    alert('Please select 1, 2, or 3.');
    return;
  }

if (selectedTreatment === 'REPLACES REGULAR SHIFT') {
  loadReplacementScheduleForStudent(activityId);
  return;
}

  google.script.run
    .withSuccessHandler(function(result) {
      alert(result.message);

      if (result.ok) {
        loadActivities();
      }
    })
    .withFailureHandler(function(error) {
      alert('⚠️ ' + String(error));
    })
    .requestActivityParticipation(
  loggedInStudent.id,
  activityId,
  selectedTreatment,
  ''
);
}

        '</div>';

            'padding:12px;' +
            'border:1px solid #3a3a3a;' +
            'border-radius:10px;' +
            'background:#222;' +
          '">' +

            '</div>' +

            '<div style="margin-top:4px; color:#ccc;">' +
              shift.regularStart +

            '</div>' +

            '</div>' +

            '<div style="margin-top:10px;">' +

  '<input ' +

      'border-radius:8px;' +
      'border:1px solid #555;' +
      'background:#111;' +
      'color:white;' +
    '"' +
  '>' +
'</div>' +

          '</div>';
      });

html +=
  '<div style="' +
    'margin-top:16px;' +
    'padding:12px;' +
    'border-radius:10px;' +
    'background:#111;' +
    'border:1px solid #444;' +
  '">' +

html +=

panel.dataset.activityHours =

     panel.innerHTML = html;

panel

panel.style.display = 'block';

      panel.scrollIntoView({
        behavior: 'smooth',

      });

    })

function updateStudentReplacementAllocation() {
  const panel =
    document.getElementById(
      'replacementSchedulePanel'
    );

  const activityHours =
    Number(
      panel.dataset.activityHours || 0
    );

  const inputs =
    document.querySelectorAll(
      '.studentReplacementHoursInput'
    );

  let allocated = 0;

  inputs.forEach(function(input) {
    const available =
      Number(
        input.dataset.available || 0
      );

    let value =
      Number(
        input.value || 0
      );

    if (value < 0) {
      value = 0;
      input.value = 0;
    }

    if (value > available) {
      value = available;
      input.value =
        available.toFixed(2);
    }

    allocated += value;
  });

  if (allocated > activityHours) {
    alert(
      'You cannot replace more hours than the activity contains.'
    );
    return;
  }

  const remaining =
    Math.max(
      0,
      activityHours - allocated
    );

  document.getElementById(
    'studentReplacementAllocated'
  ).textContent =
    allocated.toFixed(2);

  document.getElementById(
    'studentReplacementRemaining'
  ).textContent =
    remaining.toFixed(2);
}
function submitReplacementParticipation(activityId) {
  if (!loggedInStudent || !loggedInStudent.id) {
    alert('Please sign in first.');
    return;
  }

  const panel =
    document.getElementById(
      'replacementSchedulePanel'
    );

  const activityHours =
    Number(
      panel.dataset.activityHours || 0
    );

  const inputs =
    panel.querySelectorAll(
      '.studentReplacementHoursInput'
    );

  const replacementAllocations = [];
  let allocatedHours = 0;

  inputs.forEach(function(input) {
    const hours =
      Number(
        input.value || 0
      );

    if (hours <= 0) {
      return;
    }

    replacementAllocations.push({
      shiftKey:
        String(
          input.dataset.shiftKey || ''
        ),

      date:
        String(
          input.dataset.date || ''
        ),

      regularStart:
        String(
          input.dataset.start || ''
        ),

      regularEnd:
        String(
          input.dataset.end || ''
        ),

      availableHours:
        Number(
          input.dataset.available || 0
        ),

      replaceHours:
        hours
    });

    allocatedHours += hours;
  });

  allocatedHours =
    Math.round(
      allocatedHours * 100
    ) / 100;

  if (!replacementAllocations.length) {
    alert(
      'Please enter the regular hours this activity will replace.'
    );
    return;
  }

  if (
    Math.abs(
      allocatedHours - activityHours
    ) > 0.001
  ) {
    alert(
      'Replacement hours must equal the activity hours.'
    );
    return;
  }

  google.script.run
  .withSuccessHandler(function(result) {
    alert(result.message);

    if (result.ok) {
      document.getElementById(
        'replacementSchedulePanel'
      ).style.display = 'none';

      loadActivities();
    }
  })
  .withFailureHandler(function(error) {
    alert('⚠️ ' + String(error));
  })
  .requestActivityParticipation(
    loggedInStudent.id,
    activityId,
    'REPLACES REGULAR SHIFT',
    JSON.stringify(
      replacementAllocations
    )
  );
}
