<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --navy: #163a5f;
      --blue: #1f6fa9;
      --light: #f4f7fb;
      --green: #18864b;
      --red: #b83030;
      --text: #1e293b;
      --border: #d7e0ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: var(--text);
    }

    .header {
      background: linear-gradient(135deg, var(--navy), var(--blue));
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 42px);
    }

    .header p { margin: 0; opacity: .9; }

    .container {
      width: min(720px, 94%);
      margin: 24px auto;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 40, 70, .08);
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 700;
    }

    select, input {
      width: 100%;
      min-height: 54px;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 20px;
      background: white;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }

    button {
      min-height: 70px;
      border: 0;
      border-radius: 14px;
      color: white;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: wait; }
    .in { background: var(--green); }
    .out { background: var(--red); }
    .pair { background: var(--blue); width: 100%; margin-top: 18px; }

    .message {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      white-space: pre-line;
    }

    .success { display: block; background: #e8f7ee; border: 1px solid #9dd5b3; }
    .error { display: block; background: #fdecec; border: 1px solid #e4a5a5; }

    .clock {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .small {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-top: 18px;
    }

    #pairingPanel { display: none; }

    @media (max-width: 560px) {
      .buttons { grid-template-columns: 1fr; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>FIESTA IX</h1>
    <p>Office Student Time Clock</p>
  </header>

  <main class="container">
    <div class="clock" id="liveClock"></div>

    <section class="card" id="clockPanel">
      <label for="student">Student</label>
      <select id="student">
        <option value="">Loading students…</option>
      </select>

      <label for="pin">Personal PIN</label>
      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="8"
        autocomplete="off"
        placeholder="Enter your PIN"
      >

      <div class="buttons">
        <button class="in" onclick="punch('IN')">Clock In</button>
        <button class="out" onclick="punch('OUT')">Clock Out</button>
      </div>

      <div id="message" class="message"></div>
      <div class="small">Time punches are accepted only from this paired office tablet.</div>
    </section>

    <section class="card" id="pairingPanel">
      <h2>Pair Office Tablet</h2>
      <p>This step is completed once by the program coordinator.</p>

      <label for="pairingCode">Coordinator pairing code</label>
      <input id="pairingCode" type="password" autocomplete="off">

      <label for="deviceName">Tablet name</label>
      <input id="deviceName" value="FIESTA IX Office Tablet">

      <button class="pair" onclick="pairTablet()">Pair This Tablet</button>
      <div id="pairMessage" class="message"></div>
    </section>
  </main>

  <script>
    const DEVICE_STORAGE_KEY = 'fiesta_ix_device_id';
    let deviceId = localStorage.getItem(DEVICE_STORAGE_KEY);

    function createDeviceId() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return 'device-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }

    function initialize() {
      updateClock();
      setInterval(updateClock, 1000);

      if (!deviceId) {
        document.getElementById('clockPanel').style.display = 'none';
        document.getElementById('pairingPanel').style.display = 'block';
        return;
      }
      loadStudents();
    }

    function loadStudents() {
      google.script.run
        .withSuccessHandler(students => {
          const select = document.getElementById('student');
          select.innerHTML = '<option value="">Select your name</option>';

          students.forEach(student => {
            const option = document.createElement('option');
            option.value = student.id;
            option.textContent = student.name;
            select.appendChild(option);
          });
        })
        .withFailureHandler(error => {
          localStorage.removeItem(DEVICE_STORAGE_KEY);
          deviceId = null;
          document.getElementById('clockPanel').style.display = 'none';
          document.getElementById('pairingPanel').style.display = 'block';
          showMessage('pairMessage', error.message, false);
        })
        .getActiveStudents(deviceId);
    }

    function pairTablet() {
      const code = document.getElementById('pairingCode').value.trim();
      const name = document.getElementById('deviceName').value.trim();

      if (!code) {
        showMessage('pairMessage', 'Enter the coordinator pairing code.', false);
        return;
      }

      const newDeviceId = createDeviceId();
      setButtonsDisabled(true);

      google.script.run
        .withSuccessHandler(result => {
          deviceId = newDeviceId;
          localStorage.setItem(DEVICE_STORAGE_KEY, deviceId);
          showMessage('pairMessage', result.message, true);

          setTimeout(() => {
            document.getElementById('pairingPanel').style.display = 'none';
            document.getElementById('clockPanel').style.display = 'block';
            setButtonsDisabled(false);
            loadStudents();
          }, 1200);
        })
        .withFailureHandler(error => {
          setButtonsDisabled(false);
          showMessage('pairMessage', error.message, false);
        })
        .pairDevice(code, newDeviceId, name);
    }

    function punch(action) {
      const studentId = document.getElementById('student').value;
      const pin = document.getElementById('pin').value.trim();

      if (!studentId || !pin) {
        showMessage('message', 'Select your name and enter your PIN.', false);
        return;
      }

      setButtonsDisabled(true);

      google.script.run
        .withSuccessHandler(result => {
          let text = result.message + '\n' + result.timestamp;
          showMessage('message', text, true);
          resetForm();

          setTimeout(() => {
            clearMessage('message');
            setButtonsDisabled(false);
          }, 5000);
        })
        .withFailureHandler(error => {
          showMessage('message', error.message, false);
          document.getElementById('pin').value = '';
          setButtonsDisabled(false);
        })
        .submitPunch(deviceId, studentId, pin, action);
    }

    function resetForm() {
      document.getElementById('student').value = '';
      document.getElementById('pin').value = '';
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button').forEach(button => {
        button.disabled = disabled;
      });
    }

    function showMessage(id, text, success) {
      const element = document.getElementById(id);
      element.textContent = text;
      element.className = 'message ' + (success ? 'success' : 'error');
    }

    function clearMessage(id) {
      const element = document.getElementById(id);
      element.textContent = '';
      element.className = 'message';
    }

    function updateClock() {
      document.getElementById('liveClock').textContent =
        new Date().toLocaleString('en-US', {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          hour: 'numeric',
          minute: '2-digit',
          second: '2-digit'
        });
    }

    initialize();
  </script>
</body>
</html>
