<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>
    :root {
      --navy: #143b5d;
      --blue: #2477b3;
      --green: #18864b;
      --red: #b83232;
      --amber: #b7791f;
      --bg: #f4f7fb;
      --border: #d6dde6;
      --muted: #667085;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #1f2937;
    }

    .container {
      width: min(1200px, 96%);
      margin: 25px auto;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--blue)
        );

      color: white;
      padding: 24px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .controls {
      background: white;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .control-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: end;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
    }

    select,
    input {
      min-height: 44px;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 15px;
    }

    select {
      min-width: 250px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 9px;
      padding: 10px 18px;
      background: var(--green);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-top: 15px;
    }

    .error {
      display: block;
      background: #fdecec;
      border: 1px solid #e3aaaa;
      color: #8f2525;
    }

    .warning {
      display: block;
      background: #fff6dd;
      border: 1px solid #e7ce8a;
      color: #805d12;
    }

    .success {
      display: block;
      background: #e7f7ee;
      border: 1px solid #a7dbc0;
      color: #12643a;
    }

    .report-page {
      background: white;
      width: 100%;
      max-width: 1100px;
      margin: 22px auto;
      padding: 28px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,.08);
    }

    .report-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .report-header h3,
    .report-header h2 {
      margin: 4px;
    }

    .student-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 30px;
      margin-bottom: 18px;
    }

    .line {
      border-bottom: 1px solid #222;
      padding: 3px 6px;
      display: inline-block;
      min-width: 180px;
    }

    .week-title {
      margin-top: 17px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13px;
    }

    th {
      background: #111;
      color: white;
    }

    th,
    td {
      border: 1px solid #444;
      padding: 5px;
      text-align: center;
    }

    .outside-month {
      background: #ececec;
    }

    .summary {
      margin-top: 18px;
      padding: 14px;
      background: #f7f9fb;
      border-radius: 10px;
    }

    .certification {
      margin-top: 25px;
    }

    .signature-line {
      margin-top: 35px;
      width: 280px;
      border-top: 1px solid #222;
      text-align: center;
      padding-top: 5px;
    }

    @media print {
      body {
        background: white;
      }

      .hero,
      .controls {
        display: none;
      }

      .report-page {
        border: none;
        box-shadow: none;
        margin: 0;
        page-break-after: always;
      }
    }

/* =====================================================
   MONTHLY ATTENDANCE - PRINT / PDF ADJUSTMENTS
   ===================================================== */

/* Make ALL table headers black instead of gray */
.attendance-table th {
  color: #000000 !important;
  background-color: #ffffff !important;
  font-weight: 700 !important;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}


/* Keep table compact enough for Letter-size PDF */
.attendance-table {
  width: 100% !important;
  table-layout: fixed !important;
}

/* Print settings */
@media print {
  @page {
    size: Letter portrait;
    margin: 0.35in;
  }

  .attendance-table th {
    color: #000000 !important;
    background: #ffffff !important;
  }
}
/* =========================================================
   AJUSTES DE ANCHO DE COLUMNAS - HOJA DE ASISTENCIA
   ========================================================= */

/* Encabezados: texto negro y fondo blanco */
.attendance-table th {
  color: #000 !important;
  background-color: #fff !important;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* Total horas - más angosta */
.attendance-table th:nth-child(8),
.attendance-table td:nth-child(8) {
  width: 70pxpx !important;
  min-width: 70px !important;
  max-width: 70px !important;
  text-align: center !important;
  padding-left: 3px !important;
  padding-right: 3px !important;
}

/* Firma - más ancha */
.attendance-table th:nth-child(9),
.attendance-table td:nth-child(9) {
  width: 150px !important;
  min-width: 150px !important;
  max-width: 150px !important;
}

/* Iniciales - más angosta */
.attendance-table th:nth-child(10),
.attendance-table td:nth-child(10) {
  width: 70px !important;
  min-width: 70px !important;
  max-width: 70px !important;
  text-align: center !important;
  padding-left: 4px !important;
  padding-right: 4px !important;
}

/* Mantener tabla fija para respetar anchos */
.attendance-table {
  table-layout: fixed !important;
  width: 100% !important;
}
  </style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>Monthly Attendance</h1>
    <p>Preview approved student attendance before generating the official PDF.</p>
  </div>

  <div class="controls">

    <div class="control-row">

      <div>
        <label>Student</label>

        <select id="student">
          <option value="">
            Loading students…
          </option>
        </select>
      </div>

      <div>
        <label>Month</label>

        <input
          id="month"
          type="month"
        >
       
      </div>

      <button onclick="loadPreview()">
        Generate Preview
      </button>

<button
  id="downloadPdfButton"
  onclick="downloadAttendancePDF()"
  style="
    background:#143b5d;
    display:none;
  "
>
  Download PDF
</button>

    </div>

    <div
      id="message"
      class="message"
    ></div>

  </div>

  <div id="preview"></div>

</div>


<script>



function initialize() {
  const now = new Date();

  document.getElementById('month').value =
    now.getFullYear() +
    '-' +
    String(
      now.getMonth() + 1
    ).padStart(2, '0');

  google.script.run
    .withSuccessHandler(students => {
      const select =
        document.getElementById('student');

      select.innerHTML =
        '<option value="">Select student</option>';

      students.forEach(student => {
        const option =
          document.createElement('option');

        option.value =
          student.studentId

        option.textContent =
          student.studentName;

        select.appendChild(option);
      });
    })
    .getStudentsForSchedule();

}


function loadPreview() {

document.getElementById(
  'downloadPdfButton'
).style.display = 'none';

  const studentId =
    document.getElementById(
      'student'
    ).value;

  const month =
    document.getElementById(
      'month'
    ).value;

  if (!studentId || !month) {

    showMessage(
      'Select a student and month.',
      'error'
    );

    return;
  }

  google.script.run
    .withSuccessHandler(
      renderPreview
    )
    .withFailureHandler(error => {

      showMessage(
        error.message,
        'error'
      );

    })
    .getMonthlyAttendancePreview(
      studentId,
      month
    );
}

function renderPreview(data) {

  const preview =
    document.getElementById(
      'preview'
    );

  preview.innerHTML = '';

  let selectedTotalHours = 0;

  (data.pages || []).forEach(function(page) {

    (page || []).forEach(function(week) {

      selectedTotalHours +=
        Number(
          week.totalHours || 0
        );

    });

  });

showMessage(
  'Monthly attendance includes ' +
  selectedTotalHours.toFixed(2) +
  ' hours for ' +
  data.monthName +
  '.',
  'success'
); 

  data.pages.forEach(
    (weeks, pageIndex) => {

      const page =
        document.createElement(
          'div'
        );

      page.className =
        'report-page';

      let html = `
        <div class="report-header">

          <h3>
            Universidad de Puerto Rico en Ponce
          </h3>

          <h3>
            Decanato de Estudiantes
          </h3>

          <h3>
            Estudio y Trabajo
          </h3>

          <hr>

          <h2>
            HOJA DE ASISTENCIA – Proyecto FIESTA IX
          </h2>

        </div>

        <div class="student-info">

          <div>
            Nombre:
            <span class="line">
              ${escapeHtml(data.studentName)}
            </span>
          </div>

          <div>
            Núm. Seg. Soc. xxx-xx-
            <span class="line">
              ${escapeHtml(data.last4)}
            </span>
          </div>

          <div>
            Número de Estudiante:
            <span class="line">
              ${escapeHtml(data.studentNumber)}
            </span>
          </div>

          <div>
            Mes:
            <span class="line">
              ${escapeHtml(data.monthName)}
            </span>
          </div>

        </div>
      `;
document.getElementById(
  'downloadPdfButton'
).style.display = 'inline-block';

      weeks.forEach(week => {

        html += `
          <div class="week-title">
            Semana del
            ${escapeHtml(week.weekLabel)}
          </div>

          <table class="attendance-table">

            <thead>
              <tr>
                <th>Día</th>
                <th>Entrada</th>
                <th>Salida</th>
                <th>Entrada</th>
                <th>Salida</th>
                <th>Entrada</th>
                <th>Salida</th>
                <th>Total horas</th>
                <th>Firma</th>
                <th>Iniciales</th>
              </tr>
            </thead>

            <tbody>
        `;

        week.days.forEach(day => {

          html += `
            <tr class="${
              day.inMonth
                ? ''
                : 'outside-month'
            }">

              <td>
                ${escapeHtml(day.dayLabel)}
              </td>

              <td>
                ${escapeHtml(day.shifts[0].entrada)}
              </td>

              <td>
                ${escapeHtml(day.shifts[0].salida)}
              </td>

              <td>
                ${escapeHtml(day.shifts[1].entrada)}
              </td>

              <td>
                ${escapeHtml(day.shifts[1].salida)}
              </td>

              <td>
                ${escapeHtml(day.shifts[2].entrada)}
              </td>

              <td>
                ${escapeHtml(day.shifts[2].salida)}
              </td>

              <td>
                ${escapeHtml(day.totalHours)}
              </td>

              <td></td>
              <td></td>

            </tr>
          `;
        });

        html += `
    <tr
      style="
        background:#f1f3f5;
        font-weight:700;
      "
    >
      <td
        colspan="7"
        style="text-align:right;"
      >
        Total de horas de la semana:
      </td>

      <td>
        ${Number(
          week.totalHours || 0
        ).toFixed(2)}
      </td>

      <td colspan="2"></td>
    </tr>

    </tbody>
  </table>
`;
           
      });

  if (
  pageIndex ===
  data.pages.length - 1
) {

  html +=
    '<div class="certification" ' +
      'style="margin-top:24px;">' +

      '<p>' +
        'Certifico que el estudiante prestó ' +
        'los servicios en el sitio y horas ' +
        'arriba indicados.' +
      '</p>' +

      '<div style="' +
        'display:grid;' +
        'grid-template-columns:1fr 340px;' +
        'gap:55px;' +
        'align-items:start;' +
        'margin-top:30px;' +
      '">' +

        // LEFT SIDE
        '<div>' +

          '<div style="' +
            'border-top:1px solid #222;' +
            'width:100%;' +
            'max-width:360px;' +
            'padding-top:5px;' +
            'text-align:center;' +
          '">' +
            'Firma del supervisor' +
          '</div>' +

          '<div style="' +
            'border-top:1px solid #222;' +
            'width:100%;' +
            'max-width:360px;' +
            'padding-top:5px;' +
            'text-align:center;' +
            'margin-top:50px;' +
          '">' +
            'Directora del Proyecto' +
          '</div>' +

        '</div>' +

        // RIGHT SIDE
        '<div>' +

          '<div style="' +
            'border:1px solid #222;' +
            'padding:14px 16px;' +
          '">' +

            '<div style="' +
              'display:flex;' +
              'justify-content:space-between;' +
              'gap:20px;' +
              'font-size:17px;' +
              'font-weight:700;' +
            '">' +

              '<span>TOTAL DE HORAS:</span>' +

              '<span>' +
                selectedTotalHours.toFixed(2) +
              '</span>' +

            '</div>' +

          '</div>' +

          '<div style="' +
            'display:flex;' +
            'align-items:end;' +
            'gap:10px;' +
            'margin-top:18px;' +
          '">' +

            '<strong>Fecha:</strong>' +

            '<div style="' +
              'flex:1;' +
              'border-bottom:1px solid #222;' +
              'height:20px;' +
            '"></div>' +

          '</div>' +

        '</div>' +

      '</div>' +

    '</div>';

}
page.innerHTML = html;

preview.appendChild(page);

});
}

function showMessage(
  text,
  type
) {
  const box =
    document.getElementById(
      'message'
    );

  box.textContent = text;

  box.className =
    'message ' + type;
}


function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

// ADD THIS HERE ↓↓↓




// Keep anything else you already had below,
// such as initialize(), if applicable.

function downloadAttendancePDF() {

  const preview =
    document.getElementById(
      'preview'
    );

  if (!preview || !preview.innerHTML.trim()) {

    showMessage(
      'Generate the attendance preview first.',
      'error'
    );

    return;
  }

  window.print();
}

initialize();

</script>


</body>
</html>
